</section>

<h2 class="section-title">🛍️ منتجاتنا</h2>
<div class="product-grid" id="product-grid"></div>

<footer>© 2026 محل الجوالات - جميع الحقوق محفوظة</footer>

<!-- زر المحادثة -->
<button class="chat-button" id="chatBtn" onclick="toggleChat()">💬</button>

<!-- نافذة المحادثة -->
<div class="chat-window" id="chatWindow">
    <div class="chat-header">
        <span>🤖 المساعد الذكي</span>
        <button class="close-btn" onclick="toggleChat()">✕</button>
    </div>
    <!-- إطار البوت بالرابط الجديد -->
    <iframe src="https://store-bot-j9rixgz9k7lmgzskfh5x3p.streamlit.app/?embed=true" width="100%" height="100%" style="border: none; flex: 1;"></iframe>
</div>

<script>
    const storeConfig = {
        openHour: 9,
        closeHour: 21,
        closedDay: 5,
        whatsappNumber: "963930000000"
    };

    const products = [
        { name: "آيفون 13", price: "8,500,000 ل.س", image: "https://images.unsplash.com/photo-1632661674596-df8be070a5c5?w=300&h=300&fit=crop" },
        { name: "سامسونج A54", price: "4,200,000 ل.س", image: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=300&h=300&fit=crop" },
        { name: "شاحن سريع 20W", price: "150,000 ل.س", image: "https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=300&h=300&fit=crop" },
        { name: "سماعات بلوتوث", price: "350,000 ل.س", image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=300&h=300&fit=crop" }
    ];

    const grid = document.getElementById('product-grid');
    products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
            <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300?text=صورة'">
            <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="product-price">${p.price}</div>
                <a href="https://wa.me/${storeConfig.whatsappNumber}?text=${encodeURIComponent('أريد الاستفسار عن: ' + p.name)}" target="_blank" class="btn-whatsapp">💬 استفسار</a>
            </div>`;
        grid.appendChild(card);
    });

    function updateVisitors() {
        let count = parseInt(localStorage.getItem('visitorCount') || '1247');
        if (!sessionStorage.getItem('visited')) {
            count++;
            localStorage.setItem('visitorCount', count);
            sessionStorage.setItem('visited', 'true');
        }
        document.getElementById('visitor-count').textContent = `👁️ ${count.toLocaleString('ar-EG')}`;
    }
    updateVisitors();

    function updateStatus() {
        const now = new Date();
        const isOpen = (now.getDay() !== storeConfig.closedDay) && (now.getHours() >= storeConfig.openHour && now.getHours() < storeConfig.closeHour);
        const el = document.getElementById('store-status');
        el.textContent = isOpen ? '✅ مفتوح الآن' : '❌ مغلق';
        el.className = 'badge ' + (isOpen ? 'badge-open' : 'badge-closed');
    }
    updateStatus();
    setInterval(updateStatus, 60000);

    function toggleChat() {
        document.getElementById('chatWindow').classList.toggle('open');
    }
</script>

</body>
</html>
